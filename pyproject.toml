[project]
name = "new-api-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Nyxraze", email = "1094235@hr.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[project.scripts]
